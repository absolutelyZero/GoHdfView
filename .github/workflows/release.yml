# 自动打包：推送 v* 标签后跑检查、构建 Windows 与 macOS（amd64/arm64）产物并发布 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch），只上传构建产物到本次运行，
# 不创建 Release，用来在打标签前试跑打包流程。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # README 的验收项：go vet、mygo vet、测试（纯 Go，CGO_ENABLED=0）。
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # mygo_nowebview：原生 UI 不含 WebView2；-skip-installer 免去 CI 下载 NSIS。
      # 产物固定在 build/windows-amd64/GoHdfView.exe。
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=mygo_nowebview"
        run: go tool mygo build -skip-installer -platform windows/amd64

      - name: Package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          export ZIP="GoHdfView-${VERSION}-windows-amd64.zip"
          cd build/windows-amd64
          powershell -NoProfile -Command 'Compress-Archive -Path GoHdfView.exe -DestinationPath "$env:ZIP" -Force'
          sha256sum "$ZIP" > "$ZIP.sha256"
          ls -l

      # 归档交给 publish job 统一发布，避免多个 job 并发写同一个 Release。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoHdfView-windows-amd64
          path: |
            build/windows-amd64/*.zip
            build/windows-amd64/*.sha256
          if-no-files-found: error

  macos-amd64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # mygo 在 macOS 产出 build/darwin-amd64/GoHdfView.app；
      # -skip-dmg 跳过磁盘镜像，只保留应用包，随后由 Package 步骤压成 zip。
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=mygo_nowebview"
        run: go tool mygo build -skip-dmg -platform darwin/amd64

      - name: Package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          OUT="build/darwin-amd64"
          APP="$(find "$OUT" -maxdepth 1 -type d -name 'GoHdfView.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::未找到 $OUT/GoHdfView.app，请检查 mygo build 输出"
            exit 1
          fi
          ZIP="$OUT/GoHdfView-${VERSION}-macos-amd64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -l "$OUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoHdfView-macos-amd64
          path: |
            build/darwin-amd64/*.zip
            build/darwin-amd64/*.sha256
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # mygo 在 macOS 产出 build/darwin-arm64/GoHdfView.app；
      # -skip-dmg 跳过磁盘镜像，只保留应用包，随后由 Package 步骤压成 zip。
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=mygo_nowebview"
        run: go tool mygo build -skip-dmg -platform darwin/arm64

      - name: Package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          OUT="build/darwin-arm64"
          APP="$(find "$OUT" -maxdepth 1 -type d -name 'GoHdfView.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::未找到 $OUT/GoHdfView.app，请检查 mygo build 输出"
            exit 1
          fi
          ZIP="$OUT/GoHdfView-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -l "$OUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoHdfView-macos-arm64
          path: |
            build/darwin-arm64/*.zip
            build/darwin-arm64/*.sha256
          if-no-files-found: error

  # 等三个构建 job 全部完成后统一发布，避免并发写同一个 Release 产生竞态。
  publish:
    if: github.ref_type == 'tag'
    needs: [windows-amd64, macos-amd64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: GoHdfView-*

      - name: List artifacts
        run: find artifacts -type f -print

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "GoHdfView ${{ github.ref_name }}"
          body: |
            本次更新（v0.2.0）：

            - 支持同时打开多个 HDF5 文件：所有文件在同一棵对象树中作为顶层节点，选中哪个节点就显示哪个文件的数据；展开/选中/视图/分页状态按文件隔离，重复打开同一文件自动定位到已有根节点
            - 数据表可单独拉到独立窗口，便于多窗口并排对比；独立窗口沿用主窗口深色主题并自绘深色标题栏
            - 数据表支持导出 CSV，可选「当前页」或「整个数据集」，仅导出数值数据集；导出完成后可直接打开文件或所在文件夹
            - 表格行号列冻结：横向滚动数据列时行号列始终可见，并带不透明背景与分隔线
            - 保留 macOS（Intel amd64 / Apple Silicon arm64）与 Windows amd64 构建产物

            打开 HDF5 文件，浏览对象树、元数据与属性；数据集支持分页表格与灰度图像两种视图。纯 Go 实现，不依赖 HDF5 C 库与 WebView2，单文件 exe / 应用包双击即用；只读，不修改被打开的文件。

            平台产物（解压后运行）：

            - Windows amd64：GoHdfView.exe，也可从命令行传入文件路径；未签名 exe 在部分 Windows 上首次运行会提示「未知发布者」，属预期行为。
            - macOS Intel（amd64）与 Apple Silicon（arm64）：GoHdfView.app。未签名且未经公证，首次打开需右键 → 打开，或在「系统设置 → 隐私与安全性」中允许；按芯片选对应架构的包。

            仅支持 HDF5（不支持 HDF4）。每个 zip 都附有同名 .sha256 校验文件，可用 sha256sum -c（macOS 为 shasum -a 256 -c）校验。
          files: |
            artifacts/GoHdfView-windows-amd64/*.zip
            artifacts/GoHdfView-windows-amd64/*.sha256
            artifacts/GoHdfView-macos-amd64/*.zip
            artifacts/GoHdfView-macos-amd64/*.sha256
            artifacts/GoHdfView-macos-arm64/*.zip
            artifacts/GoHdfView-macos-arm64/*.sha256
          # 同一版本重新发布时覆盖同名资源（Windows zip/sha256 已存在）。
          overwrite_files: true
          generate_release_notes: true
