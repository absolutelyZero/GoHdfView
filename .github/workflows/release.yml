# 自动打包：推送 v* 标签后跑检查、构建 Windows amd64 产物并发布 GitHub Release。
# 也可在 Actions 页手动触发（workflow_dispatch），只上传构建产物到本次运行，
# 不创建 Release，用来在打标签前试跑打包流程。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # README 的验收项：go vet、mygo vet、测试（纯 Go，CGO_ENABLED=0）。
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # mygo_nowebview：原生 UI 不含 WebView2；-skip-installer 免去 CI 下载 NSIS。
      # 产物固定在 build/windows-amd64/GoHdfView.exe。
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-tags=mygo_nowebview"
        run: go tool mygo build -skip-installer -platform windows/amd64

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export ZIP="GoHdfView-${VERSION}-windows-amd64.zip"
          cd build/windows-amd64
          powershell -NoProfile -Command 'Compress-Archive -Path GoHdfView.exe -DestinationPath "$env:ZIP" -Force'
          sha256sum "$ZIP" > "$ZIP.sha256"
          ls -l

      # 标签触发：发布 Release（自动附 commit 列表）。
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "GoHdfView ${{ github.ref_name }}"
          body: |
            第一个发布版本。

            - 打开 HDF5 文件，浏览对象树、元数据与属性
            - 数据集支持分页表格与灰度图像两种视图
            - 纯 Go 实现，不依赖 HDF5 C 库与 WebView2，单文件 exe 双击即用
            - 只读：不修改被打开的文件

            下载 zip 解压后运行 `GoHdfView.exe`，也可从命令行传入文件路径。仅支持 HDF5（不支持 HDF4），当前验证平台为 Windows amd64。未签名 exe 在部分 Windows 上首次运行会提示“未知发布者”，属预期行为。
          files: |
            build/windows-amd64/*.zip
            build/windows-amd64/*.sha256
          generate_release_notes: true

      # 手动触发：产物挂在本次运行的 Artifacts 里，不创建 Release。
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: GoHdfView-windows-amd64
          path: |
            build/windows-amd64/*.zip
            build/windows-amd64/*.sha256
